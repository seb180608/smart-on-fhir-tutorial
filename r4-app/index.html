<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv='X-UA-Compatible' content='IE=edge' />
  <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
  <title>Sebbans Example-SMART-App v1B</title>

  <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
  <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
</head>

<body>
  <h1>Fhir index page</h1>
  <div id='errors'>
  </div>
  <div id="loading" class="spinner">
    <div class="bounce1"></div>
    <div class="bounce2"></div>
    <div class="bounce3"></div>
  </div>
  <div id='holder'>
    <h2>Example-SMART-App</h2>

    <h2>Patient Resource</h2>
    <table>
      <tr>
        <th>First Name:</th>
        <td id='fname'></td>
      </tr>
      <tr>
        <th>Last Name:</th>
        <td id='lname'></td>
      </tr>
      <tr>
        <th>Gender:</th>
        <td id='gender'></td>
      </tr>
      <tr>
        <th>Date of Birth:</th>
        <td id='birthdate'></td>
      </tr>
    </table>
    <h2>Observation Resource</h2>
    <table>
      <tr>
        <th>Height:</th>
        <td id='height'></td>
      </tr>
      <tr>
        <th>Systolic Blood Pressure:</th>
        <td id='systolicbp'></td>

      </tr>
      <tr>
        <th>Diastolic Blood Pressure:</th>
        <td id='diastolicbp'></td>
      </tr>
      <tr>
        <th>LDL:</th>
        <td id='ldl'></td>
      </tr>
      <tr>
        <th>HDL:</th>
        <td id='hdl'></td>
      </tr>
    </table>
    <div>
      <p>
        <code id="patient"></code>
      </p>
    </div>
  </div>
  <!-- Required JS files to enable this page to embed within an MPage -->
  <!--
      Temporarily disable cerner-smart-embeddable-lib
      <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-polyfill/6.26.0/polyfill.min.js'></script>
      <script src='./lib/js/cerner-smart-embeddable-lib-1.0.0.min.js'></script>
    -->

  <!-- jQuery (required for this example) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

  <!-- FHIR Client JS Library v2+ -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <!-- Application-level javascript-->
  <script src='./src/js/example-smart-app.js'></script>
  <script>

    localStorage.debug = "FHIR.*"
    ////OLD jquery code
    // extractData().then(
    //   //Display Patient Demographics and Observations if extractData was success
    //   function (p) {
    //     drawVisualization(p);
    //   },

    //   //Display 'Failed to call FHIR Service' if extractData failed
    //   function () {
    //     $('#loading').hide();
    //     $('#errors').html('<p> Failed to call FHIR Service </p>');
    //   }
    // );
    // debugger;

    localStorage.debug = "FHIR.*";
    debugger;
    // Modern JavaScript with async/await and proper error handling
    async function initializeApp() {
      try {
        const patientData = await extractData();
        drawVisualization(patientData);
      } catch (error) {
        console.error('Failed to extract data:', error);

        // Hide loading spinner and show error message
        const loadingElement = document.getElementById('loading');
        const errorsElement = document.getElementById('errors');

        if (loadingElement) {
          loadingElement.style.display = 'none';
        }

        if (errorsElement) {
          errorsElement.innerHTML = '<p>Failed to call FHIR Service</p>';
        }
      }
    }

    // Initialize the app when DOM is loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      debugger;
      initializeApp();
    }
  </script>
</body>

</html>
